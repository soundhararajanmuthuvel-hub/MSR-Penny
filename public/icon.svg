<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="75%">
      <stop offset="0%" stop-color="#0e4b31" />
      <stop offset="55%" stop-color="#083321" />
      <stop offset="100%" stop-color="#031a10" />
    </radialGradient>

    <!-- Gold Coin Gradient -->
    <linearGradient id="goldGrad" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="40%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Gold Rim Gradient -->
    <linearGradient id="goldRim" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cardGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4ade80" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>

    <linearGradient id="cardGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="100%" stop-color="#166534" />
    </linearGradient>

    <!-- Cream Wallet Leather -->
    <linearGradient id="creamLeather" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="70%" stop-color="#f4f5f0" />
      <stop offset="100%" stop-color="#e2e5dc" />
    </linearGradient>

    <!-- Strap Leather -->
    <linearGradient id="strapGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d4d31" />
      <stop offset="100%" stop-color="#052618" />
    </linearGradient>

    <!-- Drop Shadows -->
    <filter id="walletShadow" x="-20%" y="-20%" width="150%" height="150%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#000000" flood-opacity="0.45" />
    </filter>

    <filter id="coinGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Squircle Base Canvas -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />

  <!-- Background Financial Growth Graphic (Candlestick Bars & Trending Arrow) -->
  <g opacity="0.25">
    <rect x="75" y="210" width="28" height="110" rx="8" fill="#22c55e" />
    <rect x="115" y="170" width="28" height="150" rx="8" fill="#22c55e" />
    <rect x="385" y="130" width="32" height="190" rx="8" fill="#22c55e" />
    <rect x="428" y="95" width="28" height="225" rx="8" fill="#22c55e" />
    <!-- Growth Trendline -->
    <path d="M120 200 L240 140 L340 100 L430 65" fill="none" stroke="#22c55e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Upward Arrowhead -->
    <path d="M395 65 L435 65 L435 105" fill="none" stroke="#22c55e" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- WALLET COMPOSITION -->
  <g transform="translate(10, 0)">
    <!-- Backing Cards peeking from wallet -->
    <g transform="rotate(-12 210 145)">
      <rect x="145" y="75" width="95" height="110" rx="16" fill="url(#cardGrad1)" filter="url(#walletShadow)" />
      <!-- Card chip/line detail -->
      <line x1="160" y1="105" x2="225" y2="105" stroke="#ffffff" stroke-width="3" opacity="0.4" />
    </g>

    <g transform="rotate(-4 240 145)">
      <rect x="180" y="80" width="95" height="105" rx="16" fill="url(#cardGrad2)" />
      <line x1="195" y1="110" x2="260" y2="110" stroke="#ffffff" stroke-width="3" opacity="0.4" />
    </g>

    <!-- Shiny Gold Rupee Coin peeking behind wallet front -->
    <g transform="translate(280, 80)" filter="url(#coinGlow)">
      <circle cx="50" cy="50" r="54" fill="url(#goldRim)" />
      <circle cx="50" cy="50" r="48" fill="url(#goldGrad)" />
      <circle cx="50" cy="50" r="43" fill="none" stroke="#fef08a" stroke-width="2" opacity="0.7" />
      <!-- Rupee Glyph (₹) -->
      <path d="M37 36 h26 M37 44 h20 M37 36 v22 M37 49 h16 c8 0 13 -4 13 -10 c0 -7 -6 -9 -13 -9 M45 49 l18 24" 
            stroke="#78350f" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />
      <path d="M38 35 h24 M38 43 h18 M38 35 v22 M38 48 h15 c8 0 12 -4 12 -9 c0 -7 -5 -9 -12 -9 M45 48 l18 24" 
            stroke="#fef9c3" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none" opacity="0.8" />
    </g>

    <!-- Dark Green Inner Wallet Body -->
    <rect x="125" y="125" width="235" height="145" rx="28" fill="#07301e" />

    <!-- Cream Front Wallet Flap -->
    <g filter="url(#walletShadow)">
      <rect x="145" y="145" width="225" height="135" rx="24" fill="url(#creamLeather)" stroke="#d5d8ce" stroke-width="2" />
      <!-- Leather Perimeter Stitching -->
      <rect x="153" y="153" width="209" height="119" rx="18" fill="none" stroke="#9ca3af" stroke-width="1.8" stroke-dasharray="4,4" opacity="0.6" />

      <!-- Leather Strap with Gold Snap Button -->
      <g transform="translate(305, 180)">
        <!-- Strap -->
        <path d="M0 0 H45 C60 0, 72 14, 72 32 C72 50, 60 64, 45 64 H0 Z" fill="url(#strapGrad)" stroke="#052014" stroke-width="2" />
        <!-- Strap Stitching -->
        <path d="M2 6 H44 C56 6, 65 18, 65 32 C65 46, 56 58, 44 58 H2" fill="none" stroke="#22c55e" stroke-width="1.5" stroke-dasharray="3,3" opacity="0.5" />
        <!-- Gold Snap Button -->
        <circle cx="42" cy="32" r="14" fill="url(#goldRim)" />
        <circle cx="42" cy="32" r="12" fill="url(#goldGrad)" />
        <circle cx="40" cy="30" r="4" fill="#fef08a" opacity="0.8" />
      </g>
    </g>
  </g>

  <!-- MSR Penny TYPOGRAPHY LOGO -->
  <g transform="translate(0, 310)">
    <!-- MSR in Crisp White with Leaf Accent -->
    <g transform="translate(100, 70)">
      <!-- 'M' with stylized leaf cutout -->
      <path d="M0 0 H24 L48 38 L72 0 H96 V62 H74 V28 L54 60 H42 L22 28 V62 H0 Z" fill="#ffffff" />
      <!-- Leaf emblem in M -->
      <path d="M46 36 C46 36, 55 42, 60 48 C60 48, 52 50, 46 44 Z" fill="#34d399" />

      <!-- 'S' -->
      <path d="M110 44 C110 56, 122 64, 142 64 C164 64, 178 54, 178 38 C178 20, 156 18, 142 16 C134 14, 132 11, 132 8 C132 5, 136 2, 144 2 C154 2, 162 7, 164 12 H182 C180 2, 166 -1, 144 -1 C124 -1, 112 8, 112 22 C112 40, 134 42, 148 44 C156 46, 158 50, 158 54 C158 58, 152 61, 142 61 C130 61, 122 54, 120 44 Z" fill="#ffffff" />

      <!-- 'R' -->
      <path d="M196 0 H234 C256 0, 270 12, 270 28 C270 38, 262 46, 250 50 L274 62 H250 L228 52 H218 V62 H196 Z M218 16 V38 H232 C242 38, 248 34, 248 27 C248 20, 242 16, 232 16 Z" fill="#ffffff" />
    </g>

    <!-- 'Penny' in Mint Green (#34d399 / #4ade80) -->
    <g transform="translate(128, 135)">
      <text x="0" y="0" font-family="'Inter', -apple-system, sans-serif" font-size="64" font-weight="800" fill="#4ade80" letter-spacing="1">penny</text>
    </g>
  </g>
</svg>
